# 服务配置
server:
  port: 8848
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring 配置
spring:
  application:
    name: xunye-admin
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xunye_bar?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: pxczxn
    password: pxczxn

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.xunye.admin.entity
  configuration:
    # 日志输出 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 支付配置
payment:
  provider: mock  # mock=开发环境模拟支付 | wechat=微信支付（需实现 WechatPaymentProvider）

# 日志配置
logging:
  level:
    com.xunye.admin: debug
    root: info
