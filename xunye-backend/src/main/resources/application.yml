# 服务配置
server:
  port: 8848
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring 配置
spring:
  application:
    name: xunye-admin
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xunye_bar}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pxczxn}
    password: ${DB_PASSWORD:pxczxn}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.xunye.admin.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-fetch-size: 100
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 文件存储路径配置
file:
  upload:
    base-path: ${FILE_UPLOAD_PATH:D:/Codeing/Project/XUNYE/xunye-backend/images}
    product-path: /products
    miniapp-path: /miniapp

# 支付配置
payment:
  provider: ${PAYMENT_PROVIDER:mock}  # mock=开发环境模拟支付 | wechat=微信支付（需实现 WechatPaymentProvider）

# 日志配置
logging:
  level:
    com.xunye.admin: ${APP_LOG_LEVEL:info}
    root: info
